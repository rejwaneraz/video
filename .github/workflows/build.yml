name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true

      - name: Back up our source
        run: |
          mkdir -p /tmp/src
          cp -r lib /tmp/src/lib
          cp pubspec.yaml /tmp/src/pubspec.yaml

      - name: Generate platform folders
        run: flutter create . --project-name mini_tiktok --platforms=android

      - name: Restore our source
        run: |
          rm -rf lib
          cp -r /tmp/src/lib lib
          cp /tmp/src/pubspec.yaml pubspec.yaml

      - name: Inject Android permissions
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text(encoding="utf-8")
          perms = [
              '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          ]
          add = [x for x in perms if x not in t]
          if add:
              m = re.search(r"(<manifest[^>]*>)", t)
              assert m, "no <manifest> tag"
              t = t[:m.end()] + "\n    " + "\n    ".join(add) + t[m.end():]
              p.write_text(t, encoding="utf-8")
              print("injected", len(add), "permission(s)")
          else:
              print("permissions already present")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-tiktok-apk
          path: build/app/outputs/flutter-apk/app-release.apk
